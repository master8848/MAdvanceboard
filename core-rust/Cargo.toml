[package]
name = "kbcore"
version = "0.1.0"
edition = "2021"
description = "9-key T9 predictive text engine core (no Android deps)"
license = "GPL-3.0-only"

[lib]
name = "kbcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
fst = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# build feature enabled per spec (proc-macro UDL-less export is used;
# generate_scaffolding scaffolding needs no UDL file in this mode).
uniffi = { version = "0.32", features = ["build"] }
