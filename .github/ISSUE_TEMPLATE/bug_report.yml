name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (device/emulator, Android version, commit)
