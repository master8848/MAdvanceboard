name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core engine
        working-directory: core-rust
        run: cargo test
      - name: Clippy
        working-directory: core-rust
        run: cargo clippy -- -D warnings || true

  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate packs
        run: python3 scripts/build_pack.py validate --all || python3 -c "import json,glob; [json.load(open(p)) for p in glob.glob('packs/*.json')]; print('packs OK')"
